name: Windows POS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required build files
        shell: bash
        run: |
          for file in pos_app.py pharmacy_pos.db app_icon.ico DilabitPOS.spec DilabitPOS_Installer.iss; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $pathToInno = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $pathToInno)) {
            throw "Inno Setup was not installed at $pathToInno"
          }
          "$pathToInno" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build app with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm DilabitPOS.spec

      - name: Build Windows installer
        shell: cmd
        run: |
          set "APP_VERSION=%VERSION%"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% DilabitPOS_Installer.iss

      - name: Verify installer exists
        shell: bash
        run: |
          echo "Checking installer output..."
          ls -R Output || true
          if [ ! -f "Output/Dilabit_Pharmacy_POS_Setup_v${VERSION}.exe" ]; then
            echo "::error::Installer file not found: Output/Dilabit_Pharmacy_POS_Setup_v${VERSION}.exe"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dilabit-pos-installer
          path: Output/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe